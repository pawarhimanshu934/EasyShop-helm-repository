kind: Ingress
apiVersion: networking.k8s.io/v1

metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: {{ .Values.Ingress.paths[0].path  }}
            pathType: {{ .Values.Ingress.path[0].pathType }}
            backend:
              service:
                name: {{ .Release.Name }}-service }}
                port:
                  number: {{ .Values.Ingress.paths[0].backend.service.port.number }}
